[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own recommended DI pattern is `param: T = Depends(...)` in a
# function signature -- not a mutable-default-argument bug. Without this,
# ruff's B008 flags every route/dependency-provider function in the
# codebase (first introduced by SS-006's outfit-suggestions router).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Body", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
