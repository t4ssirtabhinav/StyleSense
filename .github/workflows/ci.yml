name: StyleSense CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
            backend:
              - 'backend/**'

  frontend-quality:
    name: Frontend — TypeScript + Lint + Test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Biome Lint
        run: npx biome check .
      - name: Jest Tests
        run: npx jest --coverage --ci

  backend-quality:
    name: Backend — Ruff + MyPy + Pytest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff Lint
        run: ruff check .
      - name: MyPy Type Check
        run: mypy .
      - name: Pytest
        run: pytest tests/ -v --tb=short

  secret-scan:
    name: Gitleaks — No Secrets in Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review:
    name: Claude PR Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          claude_args: |
            --max-turns 8
          prompt: |
            Review this pull request diff for the StyleSense project.
            Read .claude/CLAUDE.md for binding coding standards and folder
            conventions before judging anything.

            Apply this rubric (same one the QA subagent in .claude/agents/qa.md
            uses — keep verdicts consistent with it):

            CRITICAL (would block merge): missing auth/JWT checks, missing RLS,
            exposed secrets or hardcoded credentials, SQL injection, unhandled
            promises or missing null checks that would crash, direct Supabase
            calls outside features/<domain>/*.queries.ts, service_role key used
            client-side, unverified Razorpay webhook signatures.

            WARNINGS (note, don't block): SOLID violations, missing
            loading/error/empty states, currency not formatted as ₹ (Indian
            numbering), hardcoded strings that should be i18n-ready, missing
            React.memo/pagination on lists, StyleSheet.create or inline styles
            instead of NativeWind, raw View/Text instead of components/ui/,
            FlatList instead of FlashList, missing test coverage for a
            non-critical path.

            GOOD PRACTICES: call out briefly when you see clean separation of
            concerns, well-covered edge cases, or proper typing.

            Cite the specific file and line for every finding. End with a
            single verdict line: PASS or CHANGES REQUESTED. This is a first
            pass to help the human reviewer, not a replacement for one.
